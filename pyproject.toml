[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pelichstar-jailbreakvar"
version = "0.1.0"
description = "识别拆字、同义替换、多语种等变体形式，标注还原后的意图"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pelichstar" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pelichstar.github.io"
Repository = "https://github.com/pelichstar/jailbreakvar"
Issues = "https://github.com/pelichstar/jailbreakvar/issues"

[project.scripts]
jailbreakvar = "jailbreakvar:main"

[tool.setuptools]
py-modules = ["jailbreakvar"]
